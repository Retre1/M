[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apexfx-quantum"
version = "0.1.0"
description = "Hedge-fund grade algorithmic Forex trading system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "torch>=2.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
    # TQC lives in sb3-contrib and is imported at module scope by
    # apexfx.training.trainer — without it the trainer cannot be imported.
    "sb3-contrib>=2.0",
    "tensorboard>=2.15",
    "tqdm>=4.66",
    "rich>=13.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "PyWavelets>=1.4",
    # Anis-Lloyd corrected R/S. The hand-rolled uncorrected estimator read 0.76
    # on white noise, which made regime.py's mean-reverting class unreachable.
    # Single file, no dependencies beyond numpy/pandas.
    "hurst>=0.0.5",
    # Combinatorial Purged CV with purging and embargo. Used by
    # backtest/validation.py to produce many test paths instead of the single
    # one walk-forward gives; the splitting logic is fiddly and well tested
    # upstream. mlfinlab, the usual alternative, has gone commercial.
    "skfolio>=0.20",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=23.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
nlp = [
    "transformers>=4.35",
    "sentencepiece>=0.1.99",
]
dashboard = [
    "plotly>=5.18",
    "dash>=2.14",
    "dash-bootstrap-components>=1.5",
]
quantum = [
    "pennylane>=0.35",
    "tensornetwork>=0.4",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    # CI runs pytest with --timeout=120; without this plugin pytest exits 4
    # on argument parsing and no test is collected.
    "pytest-timeout>=2.1",
    # Reference implementation of the risk/performance metrics, used as a test
    # oracle only — see tests/unit/test_metrics_vs_reference.py. It found a
    # Calmar that annualised arithmetically and a Sortino that divided by the
    # loss count instead of the sample size. Not a runtime dependency: the
    # training path should not pull it in.
    "empyrical-reloaded>=0.5.12",
    "ruff>=0.1",
    "mypy>=1.7",
    "optuna>=3.4",
    "tensorboard>=2.15",
]
all = ["apexfx-quantum[mt5,nlp,dashboard,quantum,dev]"]

[project.scripts]
apexfx-train = "scripts.train:main"
apexfx-live = "scripts.live_trade:main"
apexfx-dashboard = "scripts.launch_dashboard:main"
apexfx-collect = "scripts.collect_data:main"
apexfx-backtest = "scripts.backtest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apexfx"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]

ignore = [
    # Uppercase locals are the notation of the domain, not sloppiness: X is a
    # feature matrix, Q/K/V are attention projections, T/N/W are tensor
    # dimensions, R_t and delta_A come straight from the differential-Sharpe
    # formula. Lowercasing them would make the code read further from the
    # papers and formulas it implements.
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    "N812",  # lowercase imported as non-lowercase (np.linalg as LA, etc.)
    "N813",  # camelcase imported as lowercase
    # Pydantic resolves annotations at runtime to build model fields, so moving
    # imports into a TYPE_CHECKING block is not safe here by inspection alone —
    # ruff cannot tell a pydantic field from a plain annotation. Revisit only
    # with a per-module audit.
    "TC001",
    "TC002",
    "TC003",
    # (str, Enum) -> StrEnum is not a pure refactor: str() on a (str, Enum)
    # member yields "Class.MEMBER", on a StrEnum it yields the value. These
    # enums are read from and written to YAML, so the change is observable.
    "UP042",
    # RARAReward_v5 and HiveMindGating_v2 carry a version in the name on
    # purpose; renaming them would break the isinstance dispatch in
    # forex_env.step() and every run log and document that refers to them.
    "N801",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately build objects they then throw away, and a few assert on
# broad exception types where the specific class is an implementation detail.
"tests/**" = ["F841", "B017"]
# The HTML report is one big embedded template; its CSS rules read as single
# lines and wrapping them at 100 columns makes the stylesheet harder to follow,
# not easier.
"src/apexfx/backtest/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
