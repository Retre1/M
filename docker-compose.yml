# =============================================================================
# ApexFX Quantum — Docker Compose
# Services: engine (trading bot), dashboard (web UI)
# =============================================================================

version: "3.9"

services:
  # ── GPU Training (full curriculum) ───────────────────────────────
  train:
    build:
      context: .
      target: app
    container_name: apexfx-train
    environment:
      - PYTHONPATH=/app/src
      - NVIDIA_VISIBLE_DEVICES=all
      - APEXFX_ENV=gpu1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
    command: >
      python scripts/train.py
        --symbol EURUSD
        --timeframe H1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 32G

  # ── Hyperparameter Optimization ──────────────────────────────────
  hyperopt:
    build:
      context: .
      target: app
    container_name: apexfx-hyperopt
    environment:
      - PYTHONPATH=/app/src
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
    command: >
      python scripts/hyperopt_sac.py
        --n-trials 40
        --timesteps 50000
        --device cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G

  # ── Download Market Data ─────────────────────────────────────────
  download-data:
    build:
      context: .
      target: app
    container_name: apexfx-data
    volumes:
      - ./data:/app/data
    command: >
      python scripts/download_forex_data.py
        --symbols EURUSD GBPUSD USDJPY AUDUSD USDCHF NZDUSD
        --days 700

  # ── Pretrain TFT Encoder ─────────────────────────────────────────
  pretrain:
    build:
      context: .
      target: app
    container_name: apexfx-pretrain
    environment:
      - PYTHONPATH=/app/src
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
    command: >
      python scripts/pretrain_tft.py
        --device cuda
        --epochs 50
        --batch-size 512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Backtest ─────────────────────────────────────────────────────
  backtest:
    build:
      context: .
      target: app
    container_name: apexfx-backtest
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
    command: >
      python scripts/run_synthetic_backtest.py
        --real-data
        --symbol EURUSD
    ports:
      - "8080:8080"

  # ── TensorBoard ──────────────────────────────────────────────────
  tensorboard:
    build:
      context: .
      target: app
    container_name: apexfx-tensorboard
    volumes:
      - ./logs:/app/logs:ro
    ports:
      - "6006:6006"
    command: >
      tensorboard
        --logdir /app/logs/tensorboard
        --host 0.0.0.0
        --port 6006

  # ── Live Trading Engine ──────────────────────────────────────────
  engine:
    build:
      context: .
      target: app
    container_name: apexfx-engine
    restart: unless-stopped
    env_file: .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app/src
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
    ports:
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"
    command: ["python3", "scripts/live_trade.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, time; from pathlib import Path; p = Path('data/portfolio_state.json'); assert p.exists(), 'No state file'; age = time.time() - p.stat().st_mtime; assert age < 300, f'State file stale ({age:.0f}s)'; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # --- Dashboard (Web UI) ---
  dashboard:
    build:
      context: .
      target: app
    container_name: apexfx-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      - DASH_HOST=127.0.0.1  # Production: use reverse proxy with auth for external access
      - DASH_PORT=8050
      - DASH_DEBUG=false
      - PYTHONPATH=/app/src
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./logs:/app/logs:ro
    ports:
      - "127.0.0.1:${DASH_PORT:-8050}:8050"
    command: ["python3", "scripts/launch_dashboard.py"]
    depends_on:
      engine:
        condition: service_healthy

