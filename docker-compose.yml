# =============================================================================
# ApexFX Quantum — Docker Compose
#
# Training:   docker compose up train
# Hyperopt:   docker compose up hyperopt
# Backtest:   docker compose up backtest
# Data:       docker compose up download-data
# TensorBoard: docker compose up tensorboard
# Live:       docker compose up engine dashboard
# =============================================================================

services:
  # ── GPU Training (full curriculum) ───────────────────────────────
  train:
    build:
      context: .
      target: app
    container_name: apexfx-train
    environment:
      - PYTHONPATH=/app/src
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
    command: >
      python scripts/train.py
        --symbol EURUSD
        --timeframe H1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 32G

  # ── Hyperparameter Optimization ──────────────────────────────────
  hyperopt:
    build:
      context: .
      target: app
    container_name: apexfx-hyperopt
    environment:
      - PYTHONPATH=/app/src
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
    command: >
      python scripts/hyperopt_sac.py
        --n-trials 40
        --timesteps 50000
        --device cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G

  # ── Download Market Data ─────────────────────────────────────────
  download-data:
    build:
      context: .
      target: app
    container_name: apexfx-data
    volumes:
      - ./data:/app/data
    command: >
      python scripts/download_forex_data.py
        --symbols EURUSD GBPUSD USDJPY AUDUSD USDCHF NZDUSD
        --days 700

  # ── Pretrain TFT Encoder ─────────────────────────────────────────
  pretrain:
    build:
      context: .
      target: app
    container_name: apexfx-pretrain
    environment:
      - PYTHONPATH=/app/src
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
    command: >
      python scripts/pretrain_tft.py
        --device cuda
        --epochs 50
        --batch-size 512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Backtest ─────────────────────────────────────────────────────
  backtest:
    build:
      context: .
      target: app
    container_name: apexfx-backtest
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
    command: >
      python scripts/run_synthetic_backtest.py
        --real-data
        --symbol EURUSD
    ports:
      - "8080:8080"

  # ── TensorBoard ──────────────────────────────────────────────────
  tensorboard:
    build:
      context: .
      target: app
    container_name: apexfx-tensorboard
    volumes:
      - ./logs:/app/logs:ro
    ports:
      - "6006:6006"
    command: >
      tensorboard
        --logdir /app/logs/tensorboard
        --host 0.0.0.0
        --port 6006

  # ── Live Trading Engine ──────────────────────────────────────────
  engine:
    build:
      context: .
      target: live
    container_name: apexfx-engine
    restart: unless-stopped
    env_file: .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app/src
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
    ports:
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"

  # ── Dashboard (Web UI) ──────────────────────────────────────────
  dashboard:
    build:
      context: .
      target: app
    container_name: apexfx-dashboard
    restart: unless-stopped
    environment:
      - DASH_HOST=0.0.0.0
      - DASH_PORT=8050
      - PYTHONPATH=/app/src
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./logs:/app/logs:ro
    ports:
      - "8050:8050"
    command: ["python", "scripts/launch_dashboard.py"]
