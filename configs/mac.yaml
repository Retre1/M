# ============================================================================
# ApexFX Mac Override — Apple M5, 16 GB Unified Memory
#
# Usage: APEXFX_ENV=mac python scripts/train.py
#
# Scales down GPU-optimized defaults to fit Apple Silicon:
#   - MPS acceleration (Metal Performance Shaders)
#   - Smaller batch/buffer sizes for 16GB unified memory
#   - Fewer parallel environments (10 cores)
#   - Reduced model capacity to prevent OOM
#   - Shorter training for faster iteration
# ============================================================================

base:
  performance:
    n_envs: 2                  # 16→2: conservative for 16GB
    mixed_precision: false     # MPS doesn't support AMP well yet
    torch_compile: false       # torch.compile has limited MPS support
    compile_mode: default
    cudnn_benchmark: false     # N/A for MPS
    tf32: false                # N/A for MPS
    pin_memory: false          # N/A for unified memory
    prefetch_factor: 2
    gradient_checkpointing: false
    dataloader_workers: 4      # 8→4: fewer cores

model:
  tft:
    d_model: 64                # 128→64: halved for memory
    n_heads: 4                 # 8→4: matches d_model/16
    n_encoder_layers: 1        # 2→1: lighter
    hidden_continuous_size: 32 # 64→32

  agents:
    trend:
      hidden_sizes: [256, 128]       # [512,256,128]→[256,128]
      dropout: 0.1
    reversion:
      hidden_sizes: [256, 128]
      dropout: 0.1

  gating:
    hidden_sizes: [128, 64]          # [256,128]→[128,64]

  rl:
    buffer_size: 200000              # 2M→200K: fits in 16GB
    batch_size: 256                  # 2048→256: MPS friendly
    gradient_steps: 1                # 2→1: less compute per step
    learning_starts: 5000            # 10K→5K
    n_quantiles: 15                  # 25→15: lighter TQC

  mtf:
    enabled: false                   # Disable MTF — M5 features OOM on 16GB

  uncertainty:
    n_samples: 10                    # 20→10

  diversity:
    batch_size: 256                  # 512→256

training:
  curriculum:
    stages:
      - name: real_warmup
        description: "Filtered real data: stable initialisation"
        total_timesteps: 50000       # 500K→50K: quick warmup
        data_source: real
        filter_quantile: 0.95

      - name: real_full
        description: "Full real dataset"
        total_timesteps: 200000      # 2M→200K
        data_source: real
        warm_start: true

      - name: real_augmented
        description: "Noise-augmented for robustness"
        total_timesteps: 150000      # 1.5M→150K
        data_source: real
        augmentation:
          noise_std: 0.003
          price_shift_std: 0.002
        warm_start: true

      - name: real_adversarial
        description: "Adversarial hardening"
        total_timesteps: 100000      # 1M→100K
        data_source: real
        augmentation:
          noise_std: 0.005
          price_shift_std: 0.003
        warm_start: true

  evaluation:
    eval_freq: 10000                 # 25K→10K: more frequent on shorter runs
    n_eval_episodes: 10              # 20→10

  checkpointing:
    save_freq: 25000                 # 100K→25K

  early_stopping:
    patience: 10                     # 15→10

  ewc:
    fisher_n_samples: 2000           # 5000→2000

  world_model:
    enabled: false                   # Disable — too heavy for Mac 16GB

  adversarial:
    enabled: false                   # Disable for Mac — too slow
    decay_steps: 500000
    warmup_steps: 2000
