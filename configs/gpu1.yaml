# ============================================================================
# ApexFX Overlay — Single RTX 4090 (24GB VRAM)
#
# Fixes:
# 1. VRAM: d_model 128→64, batch 2048→256, n_envs 16→4
# 2. Entropy collapse: ent_coef fixed at 0.02 (no auto-decay to 0)
# 3. Reward: scale 1000→200, penalties reduced (see trainer.py)
#
# Usage: APEXFX_ENV=gpu1 python scripts/train.py ...
# ============================================================================

base:
  performance:
    n_envs: 4               # 16→4: fewer envs to save GPU memory
    gradient_checkpointing: true
    torch_compile: false

model:
  tft:
    d_model: 64
    n_heads: 4
    attention_head_size: 16

  agents:
    trend:
      hidden_sizes: [256, 128, 64]
    reversion:
      hidden_sizes: [256, 128, 64]

  gating:
    hidden_sizes: [128, 64]

  rl:
    batch_size: 256
    buffer_size: 200000
    gradient_steps: 1
    learning_starts: 5000
    n_quantiles: 10
    # Fixed entropy coefficient — prevents collapse to 0
    # With auto, TQC drove ent_coef from 0.9→0.005 in 100K steps,
    # killing exploration. Fixed 0.02 maintains healthy exploration.
    ent_coef: 0.02

  mtf:
    lookback:
      d1: 20
      h1: 60
      m5: 30

  uncertainty:
    enabled: false

  diversity:
    enabled: false

training:
  world_model:
    enabled: false
